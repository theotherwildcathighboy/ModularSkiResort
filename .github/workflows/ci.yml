# The checks that run without Cities: Skylines II installed. The mod compile (dotnet build -t:Compile), the UI typecheck /
# build (sync-types copies the game's cs2 type declarations), SaveBatch (reads the compiled mod DLL), MoverBench and the
# Blender tests need the game or Blender and stay local: CONTRIBUTING.md lists them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-hosts:
    # windows-latest: the hosts are written and run on Windows (path case, separators)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Test hosts
        shell: pwsh
        run: |
          $failed = @()
          foreach ($h in 'LiftBatch','ResortBatch','SlopeBatch','GladeBatch','GradeBatch','BuildingBatch','BindingBatch','AutoGenBatch') {
            Write-Host "::group::$h"
            dotnet run --project "tests/$h/$h.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { $failed += $h }
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) { Write-Error "failed: $($failed -join ', ')"; exit 1 }

  gates:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mod/SkiResortUI/package-lock.json
      - name: UI dependencies
        working-directory: mod/SkiResortUI
        run: npm ci --no-audit --no-fund
      - name: US English
        run: node tools/check-us-english.js
      - name: Stats hash covers every field
        run: node tools/check-stats-hash.js
      - name: No user paths
        run: node tools/check-no-user-paths.js
      - name: No late-phase deletes
        run: node tools/check-ui-phase-deletes.js
      - name: Run prop placer rules
        run: node tools/check-run-props.js
      - name: Lift alignment (rope-point pin, one rope lane per lift type, tower ladders and twins, re-frozen manifests pin their prefab)
        run: node tools/check-lift-align.js
      - name: Lift alignment self-test (LADDER and MANIFESTSHA planted faults must fail)
        run: node tools/check-lift-align.js --self-test
      - name: No main-thread access to job-written components
        run: node tools/check-main-thread-jobs.js
      - name: Game surface matches its lock (code half; no decompile in CI)
        run: |
          node tools/game-surface-check.js --self-test
          node tools/game-surface-check.js
      - name: Listing text matches DESCRIPTION.md
        run: node tools/sync-listing.js --check
      - name: Translation template is current
        run: node tools/export-locale.js --check
      - name: Hub rules, history rules, gate fixtures
        working-directory: mod/SkiResortUI
        run: |
          node tools/test-gate-fixtures.js
          node tools/test-hub-rules.js
          node tools/test-history-rules.js
