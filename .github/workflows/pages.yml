# Docs site: build docs-site/ and deploy it to GitHub Pages on every push to main.
#
# NOT YET ACTIVE: this file lives in docs-site/ until the parent moves it to
# .github/workflows/pages.yml. One-time setup in the repository: Settings > Pages >
# Build and deployment > Source = "GitHub Actions".
#
# DOCS_SITE / DOCS_BASE feed docs-site/astro.config.mjs. For a custom domain, set
# DOCS_SITE to it, DOCS_BASE to "/", and add docs-site/public/CNAME.
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOCS_SITE: https://${{ github.repository_owner }}.github.io
  DOCS_BASE: /${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install
        working-directory: docs-site
        run: npm ci
      - name: Build
        working-directory: docs-site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
