# Docs site: build docs-site/ and deploy it to GitHub Pages on every push to main.
#
# One-time setup in the repository: Settings > Pages > Build and deployment > Source = "GitHub Actions". While the repository
# is private on the Free plan the deploy job fails by design (Pages needs a public repository there); the build job still checks
# the site.
#
# DOCS_SITE / DOCS_BASE feed docs-site/astro.config.mjs. For a custom domain, set DOCS_SITE to it, DOCS_BASE to "/", and add
# docs-site/public/CNAME.
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Read-only by default; only the deploy job gets the Pages write and the OIDC token
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOCS_SITE: https://${{ github.repository_owner }}.github.io
  DOCS_BASE: /${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install
        working-directory: docs-site
        run: npm ci
      - name: Build
        working-directory: docs-site
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
