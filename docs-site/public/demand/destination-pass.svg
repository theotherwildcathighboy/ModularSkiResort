<svg xmlns="http://www.w3.org/2000/svg" class="dc" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="dc-destination-pass-t dc-destination-pass-d" style="width:100%;height:auto;max-width:640px">
<title id="dc-destination-pass-t">Tourist parties on a destination pass, by pass price (ticket 100, pass share 50 %)</title><desc id="dc-destination-pass-d">Two lines for the lowest and highest lodge tolerance. The share is flat while the pass price is low, then falls as the daily fee of a quarter of the pass price passes the ticket-demand threshold and as the pass price passes 4 times the ticket. It reaches 0 at 1200.</desc>
<style>.dc{--bg:none;--tx:#1d2b44;--mu:#566a8a;--gr:#cbd8e5;--s1:#2e7d32;--s2:#2a63b8;--s3:#0e0e12;--s4:#b35a00;--ref:#8a9bb3}
@media (prefers-color-scheme:dark){.dc{--tx:#f0fbff;--mu:#b9c9d8;--gr:#2a3753;--s1:#6fcf74;--s2:#6aa8ff;--s3:#d5dde6;--s4:#ffa42d;--ref:#56698a}}
:root[data-theme='light'] .dc{--tx:#1d2b44;--mu:#566a8a;--gr:#cbd8e5;--s1:#2e7d32;--s2:#2a63b8;--s3:#0e0e12;--s4:#b35a00;--ref:#8a9bb3}
:root[data-theme='dark'] .dc{--tx:#f0fbff;--mu:#b9c9d8;--gr:#2a3753;--s1:#6fcf74;--s2:#6aa8ff;--s3:#d5dde6;--s4:#ffa42d;--ref:#56698a}
.dc text{fill:var(--tx);font:13px ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.dc .mu{fill:var(--mu)}.dc .gr{stroke:var(--gr);stroke-width:1;fill:none}.dc .ax{stroke:var(--mu);stroke-width:1.5;fill:none}
.dc .ref{stroke:var(--ref);stroke-width:1.5;stroke-dasharray:2 4;fill:none}
.dc .ln{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.dc .s1{stroke:var(--s1)}.dc .s2{stroke:var(--s2)}.dc .s3{stroke:var(--s3)}.dc .s4{stroke:var(--s4)}
.dc .d2{stroke-dasharray:10 5}.dc .d3{stroke-dasharray:2 5}</style>
